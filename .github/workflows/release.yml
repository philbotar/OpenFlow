name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-verify:
    name: Release verify (deep tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: ./.github/actions/setup-rust

      - name: Install Tauri Linux deps (cached)
        uses: ./.github/actions/install-tauri-deps

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
          shared-key: release-verify

      - name: Deep tests (execution + desktop)
        run: ./scripts/test-fast.sh --execution --desktop --skip-ui-typecheck

      - name: Orchestration E2E
        run: cargo nextest run -p orchestration --test workflow_e2e --no-capture

  release:
    name: Release (${{ matrix.rust_target }})
    needs: release-verify
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-26
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix crates/ui

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Verify tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver=$(jq -r '.version' crates/desktop/tauri.conf.json)
          if [[ "$tag" != "$ver" ]]; then
            echo "error: tag v${tag} does not match desktop version ${ver}" >&2
            echo "Run ./scripts/cut-release.sh on main, commit, then tag v${ver}." >&2
            exit 1
          fi

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-${{ matrix.platform }}-${{ matrix.rust_target }}

      - name: Configure macOS code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[
            -z "$APPLE_CERTIFICATE" &&
            -z "$APPLE_CERTIFICATE_PASSWORD" &&
            -z "$APPLE_SIGNING_IDENTITY_SECRET" &&
            -z "$APPLE_ID_SECRET" &&
            -z "$APPLE_PASSWORD_SECRET" &&
            -z "$APPLE_TEAM_ID_SECRET" &&
            -z "$KEYCHAIN_PASSWORD"
          ]]; then
            echo "OPENFLOW_SIGNING_MODE=ad-hoc" >> "$GITHUB_ENV"
            echo "::warning::Developer ID secrets are absent; using the configured ad-hoc signature."
            exit 0
          fi

          for name in \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY_SECRET \
            APPLE_ID_SECRET \
            APPLE_PASSWORD_SECRET \
            APPLE_TEAM_ID_SECRET \
            KEYCHAIN_PASSWORD
          do
            [[ -n "${!name}" ]] || {
              echo "::error::$name is required when APPLE_CERTIFICATE is set."
              exit 1
            }
          done

          [[ "$APPLE_SIGNING_IDENTITY_SECRET" == "Developer ID Application:"* ]] || {
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
            exit 1
          }

          certificate_path="$RUNNER_TEMP/openflow-certificate.p12"
          keychain_path="$RUNNER_TEMP/openflow-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" |
            openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "\"$APPLE_SIGNING_IDENTITY_SECRET\""

          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET"
            echo "APPLE_ID=$APPLE_ID_SECRET"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
            echo "OPENFLOW_SIGNING_MODE=developer-id"
          } >> "$GITHUB_ENV"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/desktop
          tagName: v__VERSION__
          releaseName: OpenFlow v__VERSION__
          releaseBody: |
            macOS auto-update release. Publish this draft after review.

            **First-time setup:** add repo secret `TAURI_SIGNING_PRIVATE_KEY` with the
            private key from `tauri signer generate` (see workflow comments in PR).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify macOS app signature and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.rust_target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}
        run: |
          ./scripts/verify-macos-app.sh \
            "target/${{ matrix.rust_target }}/release/bundle/macos/OpenFlow.app" \
            "$EXPECTED_ARCH" \
            "$OPENFLOW_SIGNING_MODE"
